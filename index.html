<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#15161b">
<title>Venn Kit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;1,500;1,600&family=Fraunces:ital,wght@0,400;0,500;0,600;1,500;1,600&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,500;1,600&family=Nunito:ital,wght@0,400;0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    /* Everything below derives from --bg and --ink, which the Style panel can change. */
    --bg: #15161b;
    --ink: #e8e9ee;
    --k: 1;
    --chip-h: 28px;
    --bg-hi: color-mix(in srgb, var(--bg), #fff 4%);
    --ink-2: color-mix(in srgb, var(--ink) 82%, var(--bg));
    --muted: color-mix(in srgb, var(--ink) 50%, var(--bg));
    --faint: color-mix(in srgb, var(--ink) 34%, var(--bg));
    --surface: color-mix(in srgb, var(--bg), #fff 8%);
    --surface-hi: color-mix(in srgb, var(--bg), #fff 12%);
    --line: rgba(255, 255, 255, .08);
    --line-2: rgba(255, 255, 255, .16);
    --shadow: rgba(0, 0, 0, .45);
    --danger: #ff7b6e;
    --sel: #96a5e6;
    --ease: cubic-bezier(.22, 1, .36, 1);
    --font: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: radial-gradient(ellipse at 50% 42%, var(--bg-hi) 0%, var(--bg) 100%) fixed var(--bg);
    font-family: var(--font); color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  #stage { position: fixed; inset: 0; user-select: none; -webkit-user-select: none; touch-action: none; }
  #stage.in-zone { cursor: pointer; }
  #stage.dragging, #stage.dragging * { cursor: grabbing !important; }
  #stage.selecting, #stage.selecting * { cursor: crosshair !important; }

  svg#svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  #circles { filter: drop-shadow(0 10px 28px rgba(0, 0, 0, .35)); }
  #circles .c { mix-blend-mode: screen; }
  #tint { fill: #fff; opacity: 0; transition: opacity .25s ease; }
  #tint.on { opacity: .12; }
  #tint.on.strong { opacity: .2; }
  #dim { fill: var(--bg); opacity: 0; transition: opacity .3s ease; }
  #dim.on { opacity: .8; }

  .layer { position: absolute; inset: 0; pointer-events: none; }

  /* Circle labels */
  .label { position: absolute; left: 0; top: 0; pointer-events: auto; will-change: transform; }
  .label.leaving { pointer-events: none; }
  .lab-in {
    position: relative; display: flex; align-items: center;
    font-size: calc(15px * var(--k)); font-weight: 600; letter-spacing: -.01em; white-space: nowrap;
    transition: opacity .3s ease;
  }
  .lab-in.dim { opacity: .3; }
  .label .name {
    display: block; padding: 5px 9px; border-radius: 9px; cursor: text;
    overflow: hidden; text-overflow: ellipsis;
    transition: background .2s ease, box-shadow .2s ease;
  }
  .label .name:hover { background: rgba(255, 255, 255, .08); box-shadow: 0 1px 3px var(--shadow); }
  .label input {
    font: inherit; color: inherit; letter-spacing: inherit;
    border: none; outline: none; padding: 5px 9px; border-radius: 9px;
    background: var(--surface); box-shadow: 0 0 0 2px currentColor, 0 6px 18px var(--shadow);
    min-width: 60px;
  }
  .lx {
    position: absolute; left: 100%; top: 50%; margin: -10px 0 0 2px;
    width: 20px; height: 20px; border-radius: 50%; border: none; padding: 0;
    display: grid; place-items: center; cursor: pointer;
    background: var(--surface-hi); color: var(--muted);
    box-shadow: 0 1px 4px var(--shadow);
    opacity: 0; transform: scale(.6); pointer-events: none;
    transition: opacity .2s ease, transform .25s var(--ease), color .2s, background .2s;
  }
  .lx:hover { color: var(--danger); background: var(--surface-hi); }
  .lab-in.can-x:hover .lx, .label.hover .lab-in.can-x .lx { opacity: 1; transform: none; pointer-events: auto; }
  #stage.dragging .lx, #stage.focused .lx { opacity: 0 !important; pointer-events: none !important; }

  /* Chips */
  .chip-pos {
    position: absolute; left: 0; top: 0; transform-origin: 0 0; pointer-events: auto;
    transition: transform .65s var(--ease), opacity .3s ease;
    will-change: transform;
  }
  .chip-pos.notrans, .instant .chip-pos, .instant .addc, .instant .pop { transition: none !important; }
  .chip-pos.dim { opacity: .22; }
  .chip-pos.collapsed, .chip-pos.collapsed.dim { opacity: 0; pointer-events: none; }
  .chip-pos.dragging { transition: none; z-index: 10; }
  .chip-pos.focus { z-index: 5; }
  .chip, .pchip {
    height: var(--chip-h); padding: 0 calc(12px * var(--k)); border-radius: 999px;
    display: flex; align-items: center; justify-content: center;
    background: var(--surface);
    border: 1px solid var(--line);
    box-shadow: 0 1px 2px var(--shadow), 0 3px 10px rgba(0, 0, 0, .25);
    font: 500 calc(13px * var(--k))/1 var(--font); color: var(--ink);
    cursor: pointer; white-space: nowrap;
    transition: transform .25s var(--ease), box-shadow .25s ease, background .2s, color .2s, opacity .25s, border-color .2s;
  }
  .chip span, .pchip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip-pos:hover .chip { transform: translateY(-1px); box-shadow: 0 2px 4px var(--shadow), 0 6px 16px rgba(0, 0, 0, .35); background: var(--surface-hi); }
  .chip-pos.sel .chip { border-color: color-mix(in srgb, var(--sel) 70%, transparent); box-shadow: 0 0 0 2px var(--bg), 0 0 0 3.5px var(--sel), 0 3px 10px rgba(0, 0, 0, .25); }
  .chip-pos.follow { transition: transform .14s ease-out, opacity .3s ease; z-index: 9; }
  .chip-pos.dragging .chip { transform: scale(1.06) rotate(-1.5deg); box-shadow: 0 14px 30px rgba(0, 0, 0, .55), 0 2px 6px var(--shadow); }
  .chip-pos.doomed .chip { opacity: .6; color: var(--danger); border-color: rgba(255, 123, 110, .4); transform: scale(.94) rotate(-3deg); }
  .chip-pos.leaving .chip { opacity: 0; transform: scale(.5); }
  .chip-pos.enter .chip { animation: chipIn .5s var(--ease) both; }
  @keyframes chipIn { from { opacity: 0; transform: scale(.7); } }
  .chip-pos.focus .chip { box-shadow: 0 0 0 3px var(--bg), 0 0 0 4.5px rgba(255, 255, 255, .35), 0 12px 28px var(--shadow); }
  .chip.b span, .pchip.b span { font-weight: 600; }
  .chip.i span, .pchip.i span { font-style: italic; }
  .chip.s span, .pchip.s span { text-decoration: line-through; opacity: .6; }
  .chip.tinted, .pchip.tinted {
    background: color-mix(in srgb, var(--cc) 20%, var(--surface));
    border-color: color-mix(in srgb, var(--cc) 45%, transparent); color: var(--cc-ink);
  }
  .chip-pos:hover .chip.tinted, .pchip.tinted:hover { background: color-mix(in srgb, var(--cc) 28%, var(--surface-hi)); }
  .chip-pos.more .chip { background: rgba(255, 255, 255, .04); color: var(--muted); border-style: dashed; border-color: var(--line-2); box-shadow: none; }

  /* Zone hint */
  .hint {
    position: absolute; left: 0; top: 0; width: 26px; height: 26px; padding: 0;
    border-radius: 50%; border: 1.5px dashed rgba(255, 255, 255, .3);
    background: rgba(255, 255, 255, .05); color: rgba(255, 255, 255, .5);
    display: grid; place-items: center; cursor: pointer;
    opacity: 0; pointer-events: none;
    transition: opacity .2s ease, transform .5s var(--ease), background .2s, color .2s, border-color .2s;
  }
  .hint.notrans { transition: opacity .2s ease, background .2s, color .2s; }
  .hint.show { opacity: 1; pointer-events: auto; }
  .hint:hover { background: var(--surface-hi); color: var(--ink); border-style: solid; border-color: var(--line-2); }

  /* Add circle */
  .addc {
    position: absolute; width: 38px; height: 38px; margin: -19px 0 0 -19px; padding: 0;
    border-radius: 50%; border: none; cursor: pointer;
    display: grid; place-items: center;
    background: var(--surface); color: var(--muted);
    box-shadow: 0 0 0 1px var(--line), 0 2px 6px var(--shadow), 0 8px 22px rgba(0, 0, 0, .3);
    opacity: .75;
    transition: left .65s var(--ease), top .65s var(--ease), opacity .25s ease, transform .3s var(--ease), color .2s;
  }
  .addc:hover { opacity: 1; transform: scale(1.08); color: var(--ink); }
  .addc.hide { opacity: 0; transform: scale(.6); pointer-events: none; }

  /* Font button */
  .aa {
    position: absolute; top: 16px; right: 16px; width: 36px; height: 36px; padding: 0;
    border-radius: 50%; border: none; cursor: pointer;
    background: var(--surface); color: var(--muted); display: grid; place-items: center;
    box-shadow: 0 0 0 1px var(--line), 0 2px 6px var(--shadow);
    opacity: .75; transition: opacity .2s, color .2s;
  }
  .aa:hover, .aa.on { opacity: 1; color: var(--ink); }

  /* Inline input */
  .inputwrap { position: absolute; transform: translate(-50%, -50%); pointer-events: auto; z-index: 20; }
  .inputwrap input {
    height: calc(32px * var(--k)); padding: 0 14px; border-radius: 999px;
    border: 1px solid var(--line-2); outline: none; background: var(--surface);
    font: 500 calc(13px * var(--k)) var(--font); color: var(--ink);
    box-shadow: 0 0 0 4px rgba(150, 165, 230, .16), 0 10px 26px var(--shadow);
    animation: popIn .28s var(--ease) both;
    transition: width .15s ease;
  }
  .inputwrap input::placeholder { color: var(--faint); }
  .inputwrap.out { opacity: 0; transition: opacity .15s ease; }
  @keyframes popIn { from { opacity: 0; transform: scale(.88); } }

  /* Popover */
  .pop {
    position: absolute; width: 280px; z-index: 30; pointer-events: auto;
    background: var(--surface); border-radius: 14px; padding: 14px 16px 12px;
    box-shadow: 0 16px 44px rgba(0, 0, 0, .5), 0 2px 8px var(--shadow);
    border: 1px solid var(--line);
    opacity: 0; transform: translateY(5px) scale(.98);
    transition: opacity .2s ease, transform .25s var(--ease), left .45s var(--ease), top .45s var(--ease);
    user-select: text; -webkit-user-select: text;
  }
  .pop.in { opacity: 1; transform: none; }
  .pop .cap {
    display: flex; align-items: center; gap: 6px; min-width: 0;
    font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase;
    color: var(--muted); margin-bottom: 8px;
  }
  .pop .cap .dots { display: flex; gap: 3px; flex: none; }
  .pop .cap .dot { width: 8px; height: 8px; border-radius: 50%; }
  .pop .cap .ct { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pop .ttl {
    display: block; width: 100%; border: none; outline: none; background: transparent; padding: 0;
    font: 600 16px/1.35 var(--font); color: var(--ink);
  }
  .pop textarea {
    display: block; width: 100%; border: none; outline: none; background: transparent; padding: 0;
    resize: none; min-height: 21px; max-height: 240px;
    font: 400 14px/1.5 var(--font); color: var(--ink-2);
  }
  .pop .ttl + textarea { margin-top: 6px; }
  .pop textarea::placeholder, .pop .ttl::placeholder { color: var(--faint); }
  .pop .list { display: flex; flex-wrap: wrap; gap: 6px; max-height: 260px; overflow: auto; padding: 2px; }
  .pop .pchip { max-width: 100%; }
  .pop .pchip:hover { transform: translateY(-1px); }
  .pop.wide { width: 300px; }
  .sec + .sec { margin-top: 14px; }
  .sec-t { font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin-bottom: 7px; }
  .sec .styl { margin: 0; padding: 0; border: none; }
  .seg { display: flex; gap: 2px; padding: 3px; border-radius: 10px; background: rgba(255, 255, 255, .04); border: 1px solid var(--line); }
  .seg button {
    flex: 1; height: 30px; border: none; border-radius: 7px; cursor: pointer;
    background: transparent; color: var(--muted); font-family: var(--font); font-weight: 500;
    transition: background .15s, color .15s;
  }
  .seg button:hover { color: var(--ink-2); }
  .seg button.on { background: var(--surface-hi); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-2); }

  /* Style controls */
  .pop .fmt { display: flex; gap: 2px; margin-left: auto; flex: none; text-transform: none; letter-spacing: 0; }
  .tb {
    width: 24px; height: 22px; padding: 0; border: none; border-radius: 6px; cursor: pointer;
    background: transparent; color: var(--muted); font: 600 13px/1 var(--font);
    transition: background .15s, color .15s;
  }
  .tb:hover { background: rgba(255, 255, 255, .06); color: var(--ink-2); }
  .tb.on { background: var(--surface-hi); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-2); }
  .tb.f-i { font-style: italic; font-family: Fraunces, Georgia, serif; font-size: 14px; }
  .tb.f-s { text-decoration: line-through; }
  .styl { display: flex; align-items: center; gap: 6px; margin-top: 12px; padding-top: 11px; border-top: 1px solid var(--line); }
  .sw {
    position: relative; width: 18px; height: 18px; padding: 0; flex: none;
    border: none; border-radius: 50%; cursor: pointer;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .14);
    transition: transform .2s var(--ease), box-shadow .2s;
  }
  .sw:hover { transform: scale(1.15); }
  .sw.on { box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .14), 0 0 0 2px var(--surface), 0 0 0 3.5px var(--ink-2); }
  .sw.none { background: transparent; box-shadow: inset 0 0 0 1.5px var(--line-2); overflow: hidden; }
  .sw.none::after { content: ""; position: absolute; left: 50%; top: 2px; bottom: 2px; width: 1.5px; margin-left: -.75px; background: var(--muted); transform: rotate(45deg); }
  .sw.none.on { box-shadow: inset 0 0 0 1.5px var(--line-2), 0 0 0 2px var(--surface), 0 0 0 3.5px var(--ink-2); }
  .sw.custom { background: conic-gradient(#f06e60, #e6a23c, #42be8c, #3fb6d4, #6282f0, #a274f0, #e863a6, #f06e60); }
  .sw.custom input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; border: none; padding: 0; }
  .fonts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .fopt {
    height: 52px; border-radius: 10px; border: 1px solid var(--line); cursor: pointer;
    background: rgba(255, 255, 255, .03); color: var(--ink-2);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    transition: background .15s, border-color .15s, color .15s;
  }
  .fopt:hover { background: rgba(255, 255, 255, .06); }
  .fopt b { font-size: 19px; font-weight: 500; }
  .fopt small { font: 500 11px var(--font); color: var(--muted); }
  .fopt.on { background: var(--surface-hi); border-color: var(--line-2); color: var(--ink); }

  /* Marquee selection */
  .marquee {
    position: absolute; left: 0; top: 0; z-index: 15; pointer-events: none; display: none;
    border: 1px solid color-mix(in srgb, var(--sel) 75%, transparent); border-radius: 4px;
    background: color-mix(in srgb, var(--sel) 12%, transparent);
  }
  .marquee.on { display: block; }
  .selbar {
    position: absolute; top: 16px; left: 50%; z-index: 25;
    max-width: calc(100vw - 120px); display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px;
    padding: 6px 6px 6px 14px; border-radius: 16px;
    background: var(--surface); border: 1px solid var(--line);
    box-shadow: 0 10px 30px rgba(0, 0, 0, .45), 0 2px 6px var(--shadow);
    opacity: 0; transform: translate(-50%, -8px); pointer-events: none;
    transition: opacity .2s ease, transform .25s var(--ease);
  }
  .selbar.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  .selbar .n { font: 600 13px var(--font); color: var(--ink); white-space: nowrap; }
  .selbar .fmt { display: flex; gap: 2px; }
  .selbar .styl { margin: 0; padding: 0 0 0 8px; border-top: none; border-left: 1px solid var(--line); }
  .selbar .ib {
    width: 28px; height: 28px; padding: 0; border: none; border-radius: 50%; cursor: pointer;
    display: grid; place-items: center; background: transparent; color: var(--muted);
    transition: background .15s, color .15s;
  }
  .selbar .ib:hover { background: rgba(255, 255, 255, .06); color: var(--ink); }
  .selbar .ib.del:hover { color: var(--danger); }
  @media (max-width: 600px) { .selbar { top: 62px; max-width: calc(100vw - 32px); } }

  .empty-hint {
    position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%);
    font-size: 13px; color: var(--faint); pointer-events: none; white-space: nowrap;
    opacity: 0; transition: opacity .4s ease;
  }
  .empty-hint.show { opacity: 1; }
</style>
</head>
<body>
<div id="stage">
  <svg id="svg" xmlns="http://www.w3.org/2000/svg">
    <defs id="defs"></defs>
    <g id="circles"></g>
    <rect id="tint" x="0" y="0" width="100%" height="100%" mask="url(#mh)"></rect>
    <rect id="dim" x="0" y="0" width="100%" height="100%" mask="url(#mf)"></rect>
  </svg>
  <div id="labels" class="layer"></div>
  <div id="chips" class="layer"></div>
  <button id="hint" class="hint" aria-label="Add a thought here"></button>
  <button id="addCircle" class="addc" title="Add a circle" aria-label="Add a circle"></button>
  <button id="fontBtn" class="aa" title="Colors and text" aria-label="Colors and text"></button>
  <div id="selBar" class="selbar" role="toolbar" aria-label="Selected thoughts"></div>
  <div id="floating" class="layer"></div>
  <div id="marquee" class="marquee"></div>
  <div id="emptyHint" class="empty-hint">Click inside a circle to add a thought</div>
</div>

<script>
(() => {
'use strict';

/* ---------- constants ---------- */
const STORE = 'vennkit:v1';
const FONTS = {
  sans: { name: 'Sans', css: 'Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif' },
  serif: { name: 'Serif', css: 'Fraunces, Georgia, "Times New Roman", serif' },
  mono: { name: 'Mono', css: '"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace' },
  round: { name: 'Rounded', css: 'Nunito, ui-rounded, system-ui, sans-serif' },
};
let FONT = FONTS.sans.css;
const GAP = 6, RGAP = 7, PH = 28, EDGE = 10;
// Chip metrics scale with the text size setting (see applySize).
let CH = 28, MAXTXT = 150, PADX = 12, FS = 13, LFS = 15;
const SIZES = { sm: { name: 'Small', k: .88 }, md: { name: 'Medium', k: 1 }, lg: { name: 'Large', k: 1.2 } };
const BGS = ['#15161b', '#0b0b0d', '#121a2a', '#13201b', '#21151f', '#231c16', '#1d2026'];
const BG_NAMES = ['Graphite', 'Black', 'Navy', 'Forest', 'Plum', 'Cocoa', 'Slate'];
const INKS = ['#e8e9ee', '#ffffff', '#f4ead8', '#dbeee4', '#dde5fb', '#f6dcdf'];
const INK_NAMES = ['Default', 'White', 'Cream', 'Mint', 'Ice', 'Blush'];
const SCALES = [1, .88, .76];
const OFFS = [0, -.5, .5, -1, 1, -1.5, 1.5];
const DUR = 650;
const PRESETS = ['#6282f0', '#f06e60', '#42be8c', '#e6a23c', '#a274f0', '#e863a6', '#3fb6d4', '#8c93a8'];
const PRESET_NAMES = ['Blue', 'Coral', 'Green', 'Amber', 'Violet', 'Pink', 'Teal', 'Slate'];
const okHex = c => typeof c === 'string' && /^#[0-9a-f]{6}$/i.test(c);
/* One base color -> circle fill, stroke and a readable text tint. */
const tones = new Map();
function tone(hex) {
  let t = tones.get(hex);
  if (t) return t;
  const n = parseInt(hex.slice(1), 16), rgb = [n >> 16, n >> 8 & 255, n & 255];
  const lum = (.299 * rgb[0] + .587 * rgb[1] + .114 * rgb[2]) / 255;
  const mix = k => rgb.map(v => Math.round(v + (255 - v) * k)).join(',');
  t = { fill: `rgba(${rgb.join(',')},0.30)`, stroke: `rgba(${mix(.3)},0.55)`, ink: `rgb(${mix(.4 + Math.max(0, .5 - lum) * .6)})` };
  tones.set(hex, t);
  return t;
}
// Unit layouts (radius = 1) for 1, 2, 3 circles.
const UNIT = {
  1: [[0, 0]],
  2: [[-.55, 0], [.55, 0]],
  3: [[-.52, -.3], [.52, -.3], [0, .6]],
};
const ICON_PLUS = '<svg width="14" height="14" viewBox="0 0 16 16"><path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" fill="none"/></svg>';

const ICON_TRASH = '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4.5h11M6.5 4.5V3h3v1.5M4 4.5l.7 8.5h6.6l.7-8.5M6.8 7v3.8M9.2 7v3.8"/></svg>';

  el.classList.add('dragging');
  el.classList.remove('collapsed', 'dim', 'focus');
  for (const f of drag.followers) { f.el.classList.add('follow'); f.el.classList.remove('collapsed', 'dim', 'focus'); }
  stage.classList.add('dragging');
  layoutChips();
}
function moveDrag(x, y) {
  const d = drag;
  const x0 = x - d.fx * d.w, y0 = y - d.fy * CH;
  d.el.style.transform = xf(x0, y0, 1);
  // Followers stack up behind the grabbed chip.
  d.followers.forEach((f, i) => { const o = Math.min(i + 1, 4) * 5; f.el.style.transform = xf(x0 + o, y0 + o, 1); });
  const Z = hitTest(x, y), t = Z ? Z.key : null;
  d.el.classList.toggle('doomed', !t);
  for (const f of d.followers) f.el.classList.toggle('doomed', !t);
  if (t !== d.target) { d.target = t; layoutChips(); }
}
function finishDrag(cancel) {
  const d = drag;
  drag = null;
  stage.classList.remove('dragging');
  d.el.classList.remove('dragging', 'doomed');
  for (const f of d.followers) f.el.classList.remove('follow', 'doomed');
  if (!cancel && !d.target) {
    state.items = state.items.filter(i => !d.ids.has(i.id));
  } else if (!cancel) {
    const moved = state.items.filter(i => d.ids.has(i.id) && keyOf(i.sets) !== d.target);
    for (const i of moved) i.sets = idsOf(d.target);
    state.items = state.items.filter(i => !moved.includes(i)).concat(moved);
  }
  d.el.offsetWidth;   // re-enable transition before gliding into the slot
  layoutChips(); save();
}

/* ---------- marquee selection ---------- */
const sel = new Set();
let marq = null, selSig = '';
function clearSel() {
  if (!sel.size) return;
  sel.clear();
  for (const el of chipEls.values()) el.classList.remove('sel');
  renderSelBar();
}
const selItems = () => state.items.filter(i => sel.has(i.id));
function renderSelBar() {
  selBar.classList.toggle('show', sel.size > 0 && !(drag && drag.active));
  const sig = [...sel].join('|');
  if (sig === selSig) return;
  selSig = sig;
  if (!sel.size) return;
  selBar.innerHTML = '';
  const n = document.createElement('span');
  n.className = 'n'; n.textContent = `${sel.size} selected`;
  const fmt = document.createElement('span');
  fmt.className = 'fmt';
  const its = selItems();
  for (const [k, label, tip] of [['b', 'B', 'Bold'], ['i', 'I', 'Italic'], ['s', 'S', 'Strikethrough']]) {
    const b = toolBtn(label, tip, 'f-' + k);
    b.classList.toggle('on', its.every(i => i.style && i.style[k]));
    b.addEventListener('click', () => {
      const all = selItems(), on = !all.every(i => i.style && i.style[k]);
      for (const i of all) (i.style || (i.style = {}))[k] = on;
      b.classList.toggle('on', on); layoutChips(); save();
    });
    fmt.appendChild(b);
  }
  const colors = its.map(i => (i.style && i.style.color) || null);
  const cur = colors.every(c => c === colors[0]) ? colors[0] : undefined;
  const sw = swatchRow(cur, true, c => { for (const i of selItems()) (i.style || (i.style = {})).color = c; layoutChips(); save(); });
  const iconBtn = (html, tip, cls, fn) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'ib' + (cls ? ' ' + cls : ''); b.title = tip; b.setAttribute('aria-label', tip);
    b.innerHTML = html; b.addEventListener('click', fn);
    return b;
  };
  const del = iconBtn(ICON_TRASH, 'Delete selected', 'del', () => {
    state.items = state.items.filter(i => !sel.has(i.id));
    sel.clear(); layoutChips(); save();
  });
  const done = iconBtn(ICON_X.replace(/"9"/g, '"11"'), 'Clear selection', '', clearSel);
  selBar.append(n, fmt, sw, del, done);
}

stage.addEventListener('pointerdown', e => {
  if (e.button !== 0 || drag || e.target.closest('.chip-pos, .label, .pop, .hint, .addc, .aa, .inputwrap, .selbar')) return;
  marq = { sx: e.clientX, sy: e.clientY, on: false };
  window.addEventListener('pointermove', onMarqMove);
  window.addEventListener('pointerup', onMarqUp);
  window.addEventListener('pointercancel', onMarqUp);
});
function onMarqMove(e) {
  const m = marq;
  if (!m) return;
  if (!m.on) {
    if (Math.hypot(e.clientX - m.sx, e.clientY - m.sy) < 5) return;
    m.on = true;
    clearSel();
    stage.classList.add('selecting');
    stage.classList.remove('in-zone');
    marqEl.classList.add('on');
    updateHint();
  }
  const x0 = Math.min(m.sx, e.clientX), y0 = Math.min(m.sy, e.clientY);
  const x1 = Math.max(m.sx, e.clientX), y1 = Math.max(m.sy, e.clientY);
  marqEl.style.transform = `translate(${x0}px,${y0}px)`;
  marqEl.style.width = (x1 - x0) + 'px'; marqEl.style.height = (y1 - y0) + 'px';
  sel.clear();
  for (const id of L.pos.keys()) {
    const r = chipRect(id);
    if (r.x < x1 && r.x + r.w > x0 && r.y < y1 && r.y + r.h > y0) sel.add(id);
  }
  for (const [id, el] of chipEls) el.classList.toggle('sel', sel.has(id));
  renderSelBar();
}
function onMarqUp() {
  window.removeEventListener('pointermove', onMarqMove);
  window.removeEventListener('pointerup', onMarqUp);
  window.removeEventListener('pointercancel', onMarqUp);
  const m = marq;
  marq = null;
  if (!m || !m.on) return;
  swallow = true;   // the click that ends a marquee shouldn't add a thought
  stage.classList.remove('selecting');
  marqEl.classList.remove('on');
  updateHint(); onHover();
}

/* ---------- events ---------- */
chipsL.addEventListener('pointerdown', e => {
  const el = e.target.closest('.chip-pos');
  if (!el || el.classList.contains('leaving')) return;
  beginPress(e, el.dataset.more ? { more: el.dataset.more, el } : { id: el.dataset.id, el });
});

let swallow = false;
window.addEventListener('pointerdown', e => {
  swallow = false;
  const t = e.target;
  const keep = t.closest('.pop') || t.closest('.chip-pos') || t.closest('.aa') || (ui.renaming && t.closest('.label input'));
  if (ui.pop && !keep) {
    // Clicking another label opens its own popover; anything else just dismisses.
    if (!t.closest('.label .name')) swallow = true;
    closePop();
  }
  if (ui.input && !t.closest('.inputwrap')) { commitInput(); swallow = true; }
}, true);

stage.addEventListener('click', e => {
  if (swallow) { swallow = false; return; }
  if (drag || e.target.closest('.chip-pos, .label, .pop, .hint, .addc, .aa, .inputwrap, .selbar')) return;
  if (sel.size) { clearSel(); return; }
  const Z = hitTest(e.clientX, e.clientY);
  if (!Z) return;
  if (Z.ids.length === 1) openInput(Z.key, e.clientX, e.clientY);
  else openZonePop(Z.key, e.clientX, e.clientY);
});

labelsL.addEventListener('click', e => {
  const lab = e.target.closest('.label');
  if (!lab || lab.classList.contains('leaving')) return;
  const id = lab.dataset.id;
  if (e.target.closest('.lx')) { removeSet(id); return; }
  if (e.target.closest('.name') && ui.renaming !== id) openSetPop(id);
});

hintEl.addEventListener('click', () => {
  const k = hintEl.dataset.key, ph = L.ph.get(k);
  if (ph) openInput(k, ph.x, ph.y);
});
addBtn.addEventListener('click', addSet);
fontBtn.addEventListener('click', () => { if (ui.pop && ui.pop.kind === 'font') closePop(); else openStylePop(); });

let lastTarget = null, mouse = { x: -1e4, y: -1e4 }, hoverRaf = 0;
stage.addEventListener('pointermove', e => {
  mouse.x = e.clientX; mouse.y = e.clientY; lastTarget = e.target;
  if (!hoverRaf) hoverRaf = requestAnimationFrame(onHover);
});
document.addEventListener('pointerleave', () => { mouse.x = mouse.y = -1e4; lastTarget = null; onHover(); });
function onHover() {
  hoverRaf = 0;
  if (drag || (marq && marq.on)) return;
  const overUI = lastTarget && lastTarget.closest && lastTarget.closest('.pop, .label, .addc, .aa, .inputwrap, .selbar');
  const sets = overUI ? [] : setsAt(mouse.x, mouse.y);
  const key = sets.length ? keyOf(sets) : null;
  ui.hoverSets = sets;
  for (const [id, el] of labelEls) el.classList.toggle('hover', sets.includes(id));
  stage.classList.toggle('in-zone', !!key && !ui.pop && !ui.input);
  if (key !== ui.hoverKey) { ui.hoverKey = key; updateHint(); }
}

window.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (drag) { window.removeEventListener('pointermove', onPressMove); press = null; finishDrag(true); }
  else if (ui.input) cancelInput();
  else if (ui.pop) closePop();
  else clearSel();
});

let resizeT;
window.addEventListener('resize', () => {
  stage.classList.add('instant');
  relayout({ instant: true });
  clearTimeout(resizeT);
  resizeT = setTimeout(() => stage.classList.remove('instant'), 150);
});

applyFont(); applySize(); applyColors();
relayout({ initial: true });
loadFaces();
})();
</script>
</body>
</html>
